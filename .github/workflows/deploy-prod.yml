name: Production byhnex.com

# main is production: each push to main (direct or merged PR) runs the full CI, then deploys to OVH.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  deploy:
    name: Déploiement
    needs: ci
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://byhnex.com
    env:
      SSH_HOST: ${{ secrets.PROD_SSH_HOST }}
      SSH_USER: ${{ secrets.PROD_SSH_USER }}
      WEB_DIR: ${{ secrets.PROD_WEB_DIR }}
      API_DIR: byhnex-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_mysql, sodium, intl, mbstring
          tools: composer:v2
          coverage: none
      - name: Build du site
        run: |
          npm --prefix frontend ci
          npm --prefix frontend run build
          node deploy/build.mjs
      - name: Dépendances de l'API (production, sans outils de développement)
        working-directory: backend
        run: composer install --no-dev --no-interaction --no-progress --optimize-autoloader --classmap-authoritative
      - name: Connexion SSH
        env:
          SSH_KEY: ${{ secrets.PROD_SSH_KEY }}
          SSH_PASSWORD: ${{ secrets.PROD_SSH_PASSWORD }}
        run: |
          test -n "$SSH_HOST" && test -n "$SSH_USER" && test -n "$WEB_DIR" || { echo "::error::Secrets PROD_SSH_HOST, PROD_SSH_USER et PROD_WEB_DIR requis."; exit 1; }
          case "$WEB_DIR" in /*|*..*|"") echo "::error::PROD_WEB_DIR doit être un chemin relatif au dossier personnel, par exemple www."; exit 1;; esac
          install -m 700 -d ~/.ssh
          cp deploy/known_hosts ~/.ssh/known_hosts
          if [ -n "$SSH_KEY" ]; then
            printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key && chmod 600 ~/.ssh/deploy_key
            echo "SSH_CMD=ssh -i $HOME/.ssh/deploy_key -o BatchMode=yes" >> "$GITHUB_ENV"
          elif [ -n "$SSH_PASSWORD" ]; then
            sudo apt-get install -y -qq sshpass > /dev/null
            echo "SSHPASS=$SSH_PASSWORD" >> "$GITHUB_ENV"
            echo "SSH_CMD=sshpass -e ssh -o PubkeyAuthentication=no" >> "$GITHUB_ENV"
          else
            echo "::error::Ajoutez le secret PROD_SSH_KEY (recommandé) ou PROD_SSH_PASSWORD."; exit 1
          fi
      - name: Configuration privée de l'API (créée au premier déploiement, sur le serveur)
        run: $SSH_CMD "$SSH_USER@$SSH_HOST" "php" < deploy/bootstrap-env.php
      - name: Clé du bot et réglages des paiements Solana (sur le serveur)
        env:
          SOLANA_RPC_URL: ${{ secrets.SOLANA_RPC_URL }}
          PLATFORM_SOLANA_WALLET: ${{ secrets.PLATFORM_SOLANA_WALLET || vars.PLATFORM_SOLANA_WALLET }}
        run: |
          # Values travel on SSH's standard input, never on a command line; empty ones keep what the server has.
          printf 'SOLANA_RPC_URL=%s\nPLATFORM_SOLANA_WALLET=%s\n' "$SOLANA_RPC_URL" "$PLATFORM_SOLANA_WALLET" \
            | $SSH_CMD "$SSH_USER@$SSH_HOST" "umask 077 && cat > ~/$API_DIR/.env.deploy.tmp"
          key=$($SSH_CMD "$SSH_USER@$SSH_HOST" "php" < deploy/server-env.php)
          [[ "$key" =~ ^[0-9a-f]{64}$ ]] || { echo "::error::Clé publique du bot illisible."; exit 1; }
          echo "BOT_PUBLIC_KEY=$key" >> "$GITHUB_ENV"
      - name: Serveur du bot des abonnés (Cloudflare)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          BOT_SERVER_URL: ${{ vars.BOT_SERVER_URL }}
        run: |
          # Pasted secrets often carry spaces, a newline, "Bearer " or a whole dashboard URL: keep only the useful part.
          # The token is the longest run of token characters (a pasted "curl … Bearer <token>" works too).
          CLOUDFLARE_API_TOKEN=$(printf '%s' "$CLOUDFLARE_API_TOKEN" | grep -oE '[A-Za-z0-9_-]{30,}' | awk '{ print length, $0 }' | sort -n | tail -n1 | cut -d' ' -f2 || true)
          if [ -n "$CLOUDFLARE_API_TOKEN" ]; then echo "::add-mask::$CLOUDFLARE_API_TOKEN"; fi
          CLOUDFLARE_ACCOUNT_ID=$(printf '%s' "$CLOUDFLARE_ACCOUNT_ID" | grep -oiE '[a-f0-9]{32}' | head -n1 | tr 'A-F' 'a-f' || true)
          export CLOUDFLARE_API_TOKEN
          # Optional: without a valid account id, wrangler uses the only account the token can reach.
          if [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then export CLOUDFLARE_ACCOUNT_ID; else unset CLOUDFLARE_ACCOUNT_ID; fi
          if [ -n "$CLOUDFLARE_API_TOKEN" ]; then
            if out=$(npx --yes wrangler@4.146.0 deploy --config bot-server/wrangler.toml --var "BOT_PUBLIC_KEY:$BOT_PUBLIC_KEY" 2>&1); then
              echo "$out"
              url=$(printf '%s\n' "$out" | grep -oE 'https://[a-z0-9.-]+\.workers\.dev' | head -n1)
              if [ -n "$url" ]; then BOT_SERVER_URL=$url; fi
            else
              # The rest of the site still goes live; Cloudflare's answer is shown as an annotation (long tokens hidden).
              echo "$out"
              msg=$(printf '%s\n' "$out" | grep -vE '^\s*$' | tail -n 12 | sed -E 's/[A-Za-z0-9_-]{35,}/***/g' | tr '\n' ' ' | cut -c1-1500)
              echo "::warning title=Serveur du bot non déployé::$msg"
            fi
          else
            echo "::warning::Secret CLOUDFLARE_API_TOKEN absent : serveur du bot des abonnés non déployé (voir deploy/README.md)."
          fi
          printf 'BOT_SERVER_URL=%s\n' "$BOT_SERVER_URL" | $SSH_CMD "$SSH_USER@$SSH_HOST" "umask 077 && cat > ~/$API_DIR/.env.deploy.tmp"
          $SSH_CMD "$SSH_USER@$SSH_HOST" "php" < deploy/server-env.php > /dev/null
          # bot.html reads the bot server's address here; null shows its "being set up" state.
          BOT_SERVER_URL=$BOT_SERVER_URL node -e "require('fs').writeFileSync('dist/bot-config.json', JSON.stringify({url: process.env.BOT_SERVER_URL || null}) + '\n')"
          echo "Serveur du bot : ${BOT_SERVER_URL:-non configuré}"
      - name: Copie de secours de la version en ligne
        run: $SSH_CMD "$SSH_USER@$SSH_HOST" "rm -rf ~/deploy-previous && mkdir ~/deploy-previous && cp -a ~/$WEB_DIR ~/deploy-previous/www && cp -a ~/$API_DIR ~/deploy-previous/api"
      - name: Envoi de l'API (hors du dossier web)
        run: |
          rsync -rlz --delete --chmod=D755,F644 \
            --filter='P .env.local' --filter='P .env.prod.local' --filter='P var/' \
            --exclude='/tests/' --exclude='/var/' --exclude='/.env.local' --exclude='/.env.prod.local' --exclude='/.env.test' \
            --exclude='/phpunit.dist.xml' --exclude='/phpstan.dist.neon' --exclude='/.php-cs-fixer*' \
            --exclude='/compose*.yaml' --exclude='/.editorconfig' --exclude='/.gitignore' \
            -e "$SSH_CMD" backend/ "$SSH_USER@$SSH_HOST:$API_DIR/"
      - name: Cache et migrations de la base
        run: $SSH_CMD "$SSH_USER@$SSH_HOST" "cd ~/$API_DIR && php bin/console cache:clear --env=prod && php bin/console doctrine:migrations:migrate --env=prod --no-interaction --allow-no-migration"
      - name: Envoi du site
        run: |
          rsync -rlz --delete --chmod=D755,F644 \
            --filter='P googleb4faf05172e6f27a.html' \
            -e "$SSH_CMD" dist/ "$SSH_USER@$SSH_HOST:$WEB_DIR/"
      - name: Vérification en ligne
        run: |
          expected=$(cat dist/version.txt)
          for i in $(seq 1 10); do
            online=$(curl -fsS "https://byhnex.com/version.txt?ci=$GITHUB_RUN_ID-$i" || true)
            [ "$online" = "$expected" ] && break
            sleep 3
          done
          [ "$online" = "$expected" ] || { echo "::error::byhnex.com sert la version '$online' au lieu de '$expected'."; exit 1; }
          curl -fsS https://byhnex.com/ | grep -q 'assets/account-'
          curl -fsS https://byhnex.com/api/health | grep -q '"ok":true'
          curl -fsS https://byhnex.com/abonnement.html | grep -q 'assets/abonnement-'
          echo "byhnex.com est en ligne avec la version $expected."
