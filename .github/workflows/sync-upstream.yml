name: Changements d'osvalt16 en production

# Every 10 minutes: merges osvalt16/byhnex main into this repository's main, then the push deploys to
# byhnex.com (deploy-prod.yml). On a conflict, osvalt16's version wins.
# Needs the SYNC_TOKEN secret: fine-grained token limited to tchoifr/byhnex, Contents and Workflows
# in read and write (the default token may not push changes to workflow files).
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository == 'tchoifr/byhnex'
    runs-on: ubuntu-latest
    steps:
      - name: Jeton de synchronisation
        env:
          SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
        run: test -n "$SYNC_TOKEN" || { echo "::error::Secret SYNC_TOKEN absent (voir deploy/README.md)."; exit 1; }
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.SYNC_TOKEN }}
      - name: Fusion de osvalt16/byhnex
        env:
          # Needed since osvalt16/byhnex is private: a token that can read it (Contents: read), see deploy/README.md.
          UPSTREAM_TOKEN: ${{ secrets.UPSTREAM_TOKEN }}
        run: |
          git config user.name "byhnex-sync"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/osvalt16/byhnex.git
          # The checkout's credentials (SYNC_TOKEN, this repository only) must not be sent to osvalt16's repository.
          # http.extraheader is multi-valued: the empty value clears the checkout's header first, otherwise
          # GitHub receives two Authorization headers and answers 400 "Duplicate header".
          auth=(-c "http.https://github.com/.extraheader=")
          if [ -n "$UPSTREAM_TOKEN" ]; then
            basic=$(printf 'x-access-token:%s' "$(printf '%s' "$UPSTREAM_TOKEN" | tr -d '[:space:]')" | base64 -w0)
            echo "::add-mask::$basic"
            auth+=(-c "http.https://github.com/.extraheader=AUTHORIZATION: basic $basic")
          fi
          if ! git "${auth[@]}" fetch --quiet upstream main; then
            echo "::error title=Synchro osvalt16 impossible::Lecture de osvalt16/byhnex refusée. Vérifiez le secret UPSTREAM_TOKEN : jeton valide, non expiré, qui peut lire ce dépôt (voir deploy/README.md)."
            exit 1
          fi
          count=$(git rev-list --count HEAD..upstream/main)
          if [ "$count" = "0" ]; then echo "Rien de nouveau chez osvalt16."; exit 0; fi
          echo "$count nouveau(x) commit(s) d'osvalt16 :"
          git log --oneline HEAD..upstream/main
          git merge --no-edit -X theirs upstream/main -m "chore(sync): changements d'osvalt16 ($count commits)"
          git push origin HEAD:main
