name: Signaux mobile
on:
  schedule:
    - cron: '2-59/5 * * * *'
  workflow_dispatch:
    inputs:
      test_push:
        description: Envoyer une notification de test au telephone
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: signaux
  cancel-in-progress: false
jobs:
  signaux:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Recupere l'etat precedent (anti-doublons de notifications)
        run: |
          git fetch origin data --depth=1 2>/dev/null || true
          git show origin/data:data.json > prev.json 2>/dev/null || echo "premier passage"
      - name: Bibliotheque d'envoi des notifications push
        run: npm install --no-save --no-audit --no-fund web-push@3.6.7
      - name: Calcule les signaux et notifie si entree en zone
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          BYHNEX_PUSH: ${{ secrets.BYHNEX_PUSH }}
          TEST_PUSH: ${{ inputs.test_push }}
          COINBASE_KEY_NAME: ${{ secrets.COINBASE_KEY_NAME }}
          COINBASE_PRIVATE_KEY: ${{ secrets.COINBASE_PRIVATE_KEY }}
        run: node scripts/build-data.mjs
      - name: Publie data.json + widget.txt sur la branche data
        run: |
          cd out
          git init -q -b data
          git config user.name "signaux-bot"
          git config user.email "actions@users.noreply.github.com"
          git add .
          git commit -q -m "signaux $(date -u +%Y-%m-%dT%H:%M)Z"
          git push -f -q https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git data
