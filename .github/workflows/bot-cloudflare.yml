name: Bot Cloudflare
# Deploie bot-worker/ sur Cloudflare Workers (offre gratuite) : bot virtuel 24 h/24, argent fictif.
# Secret requis (une seule fois, proprietaire) : CLOUDFLARE_API_TOKEN (modele « Edit Cloudflare Workers »).
# CLOUDFLARE_ACCOUNT_ID est facultatif (deduit du jeton). Publie l'adresse du bot dans bot-config.json pour le site.
on:
  push:
    branches: [main]
    paths: ['bot-worker/**', 'bot-engine.js', '.github/workflows/bot-cloudflare.yml']
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency:
  group: bot-cloudflare
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Secrets presents ?
        id: check
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # Only the token is required. A pasted token often carries spaces, a newline, "Bearer " or even the
          # whole curl example: keep only the token itself (never printed).
          TOKEN=$(printf '%s' "$CLOUDFLARE_API_TOKEN" | grep -oE '[A-Za-z0-9_-]{30,}' | awk '{ print length, $0 }' | sort -n | tail -n1 | cut -d' ' -f2)
          if [ -n "$TOKEN" ]; then echo "::add-mask::$TOKEN"; fi
          ACCOUNT=$(printf '%s' "$CLOUDFLARE_ACCOUNT_ID" | grep -oE '[a-f0-9]{32}' | head -n1)
          ok=true
          if [ -z "$TOKEN" ]; then
            echo "::warning::Secret CLOUDFLARE_API_TOKEN manquant : deploiement ignore."; ok=false
          else
            echo "Jeton lu : ${#TOKEN} caracteres (le secret en contenait ${#CLOUDFLARE_API_TOKEN}), type ${TOKEN:0:5}."
            # Hash of the token pasted in the chat on 2026-10-05 and deleted since: spots it if it is pasted again.
            if [ "$(printf '%s' "$TOKEN" | sha256sum | cut -d' ' -f1)" = "723d204952d58447a38e9c3e77f4b6327c0a65321ec46c6f2cca3239ee079e1f" ]; then echo "::error::C'est l'ANCIEN jeton (supprime). Cree un nouveau jeton et remplace le secret."; fi
            VERIFY=$(curl -sS -H "Authorization: Bearer $TOKEN" https://api.cloudflare.com/client/v4/user/tokens/verify || true)
            if [ -n "$ACCOUNT" ] && ! echo "$VERIFY" | jq -e '.success' > /dev/null 2>&1; then
              # Account-owned tokens are verified on the account, not on the user.
              VERIFY=$(curl -sS -H "Authorization: Bearer $TOKEN" "https://api.cloudflare.com/client/v4/accounts/$ACCOUNT/tokens/verify" || true)
            fi
            echo "Verification Cloudflare : $(echo "$VERIFY" | jq -c '{success, status: .result.status, errors: [.errors[]?.message]}' 2>/dev/null || echo illisible)"
            if [ -z "$ACCOUNT" ]; then
              ACCOUNTS=$(curl -sS -H "Authorization: Bearer $TOKEN" "https://api.cloudflare.com/client/v4/accounts" || true)
              ACCOUNT=$(echo "$ACCOUNTS" | jq -r '.result[0].id // empty' 2>/dev/null)
              if [ -z "$ACCOUNT" ]; then echo "Comptes : $(echo "$ACCOUNTS" | jq -c '[.errors[]?.message]' 2>/dev/null)"; fi
            fi
            if [ -z "$ACCOUNT" ]; then echo "::error::Jeton refuse ou sans acces au compte Cloudflare (voir la verification ci-dessus)."; ok=false; fi
          fi
          echo "CLOUDFLARE_API_TOKEN=$TOKEN" >> "$GITHUB_ENV"
          echo "CLOUDFLARE_ACCOUNT_ID=$ACCOUNT" >> "$GITHUB_ENV"
          echo "ok=$ok" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        if: steps.check.outputs.ok == 'true'
        with:
          node-version: 22
      - name: Tests du moteur
        if: steps.check.outputs.ok == 'true'
        run: npm test
      - name: Espace de stockage KV et sous-domaine workers.dev
        if: steps.check.outputs.ok == 'true'
        id: cf
        run: |
          API="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID"
          AUTH="Authorization: Bearer $CLOUDFLARE_API_TOKEN"
          KV_ID=$(curl -fsS -H "$AUTH" "$API/storage/kv/namespaces?per_page=100" | jq -r '.result[] | select(.title=="byhnex-bot") | .id' | head -n1)
          if [ -z "$KV_ID" ]; then
            KV_ID=$(curl -fsS -X POST -H "$AUTH" -H "Content-Type: application/json" -d '{"title":"byhnex-bot"}' "$API/storage/kv/namespaces" | jq -r '.result.id')
          fi
          test -n "$KV_ID" && test "$KV_ID" != "null"
          SUB=$(curl -sS -H "$AUTH" "$API/workers/subdomain" | jq -r '.result.subdomain // empty')
          if [ -z "$SUB" ]; then
            SUB="byhnex-$(echo "$CLOUDFLARE_ACCOUNT_ID" | cut -c1-6)"
            curl -fsS -X PUT -H "$AUTH" -H "Content-Type: application/json" -d "{\"subdomain\":\"$SUB\"}" "$API/workers/subdomain" > /dev/null
          fi
          sed -i "s/__KV_ID__/$KV_ID/" bot-worker/wrangler.toml
          echo "url=https://byhnex-bot.$SUB.workers.dev" >> "$GITHUB_OUTPUT"
      - name: Deploiement du bot
        if: steps.check.outputs.ok == 'true'
        working-directory: bot-worker
        run: npx --yes wrangler@4 deploy
      - name: Verification
        if: steps.check.outputs.ok == 'true'
        run: |
          for i in 1 2 3 4 5 6 7 8 9; do
            if curl -fsS "${{ steps.cf.outputs.url }}/health" | jq -e '.ok' > /dev/null; then echo "bot OK"; exit 0; fi
            sleep 10
          done
          echo "Le bot ne repond pas encore (le premier sous-domaine workers.dev peut prendre quelques minutes)"; exit 1
      - name: Publie l'adresse du bot pour le site
        if: steps.check.outputs.ok == 'true'
        run: |
          echo "{\"url\": \"${{ steps.cf.outputs.url }}\"}" > bot-config.json
          if git diff --quiet -- bot-config.json; then echo "adresse inchangee"; exit 0; fi
          git config user.name "bot-cloudflare"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "chore(bot): adresse du bot Cloudflare" -- bot-config.json
          git push
          # un push fait avec GITHUB_TOKEN ne relance pas les workflows : on redeploie le site explicitement
          curl -fsS -X POST -H "Authorization: Bearer ${{ github.token }}" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/pages.yml/dispatches" -d '{"ref":"main"}'
