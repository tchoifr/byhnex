/* ---------- data ---------- */
// Closed candles drive the decisions; the price of the candle still open is the live quote.
async function fetchCandles(asset, interval, limit, fresh = false) {
  const key = `${asset}|${interval}|${limit}`, hit = cache.get(key);
  if (!fresh && hit && Date.now() - hit.at < 120000) return hit;
  const r = await fetch(`https://api.binance.com/api/v3/klines?symbol=${asset}USDT&interval=${interval}&limit=${limit}`);
  if (!r.ok) throw Error('Binance HTTP ' + r.status);
  const rows = await r.json(), now = Date.now();

  if (!candles.length) throw Error('Binance vide');
  const out = {at: now, candles, price: +rows.at(-1)[4] || candles.at(-1).close};
  cache.set(key, out);
  return out;
}

/* ---------- replay ---------- */
async function runReplay() {

  const id = ++loadId, cfg = config();
  $('error').textContent = '';
  try { validateConfig(cfg); } catch (e) { $('error').textContent = e.message; return; }

  try {
    const got = await Promise.all(prefs.assets.map(a => fetchCandles(a, prefs.interval, 1000)));
    if (id !== loadId) return;
    candlesBy = Object.fromEntries(prefs.assets.map((a, i) => [a, got[i].candles]));
    replay = simulateMany(candlesBy, cfg);
    replay.cfg = cfg;
  } catch (e) {
    if (id !== loadId) return;
    replay = null;
    $('error').textContent = e.message.startsWith('Binance') || e.name === 'TypeError' ? 'Historique Binance indisponible. Réessaie dans un instant.' : e.message;
  }
  renderAll();
}

/* ---------- live bot ---------- */
async function startLive() {
  if (mode === 'server') return startServer();
  saveForm();
  const cfg = config();
  try { validateConfig(cfg); } catch (e) { $('error').textContent = e.message; return; }
  $('start').disabled = true; $('start').textContent = 'Démarrage…';
  try {
    const assets = [...prefs.assets], sub = subCfg(cfg, assets.length);
    const got = await Promise.all(assets.map(a => fetchCandles(a, prefs.interval, 500, true)));
    const next = {assets, interval: prefs.interval, cfg, states: {}, prices: {}, entry: {}, startedAt: Date.now(), checkedAt: Date.now(), history: [], checks: []};
    assets.forEach((a, i) => {

      state.lastTime = candles.at(-2)?.closeTime ?? 0;

      next.checks.push(...log.map(e => ({...e, asset: a})));
      next.states[a] = state; next.prices[a] = price; next.entry[a] = price;
      candlesBy[a] = candles;
    });

    write(LIVE_KEY, live);
    schedule(false);

  renderAll();
}
function liveTotals() {
  const sub = subCfg(live.cfg, live.assets.length), fee = live.cfg.fee / 100;
  let bot = 0, hold = 0;
  for (const a of live.assets) {
    const price = live.prices[a] ?? live.states[a].ref ?? 0;
    bot += equityOf(live.states[a], price);
    hold += live.entry?.[a] ? sub.capital * (1 - fee) / live.entry[a] * price : sub.capital;
  }

}
function record() {
  const {bot, hold} = liveTotals(), h = live.history ||= [], now = Date.now();

}
async function tickLive() {

  });

}

}
function resetLive() { live = null; clearInterval(timer); clearInterval(clock); write(LIVE_KEY, null); runReplay(); }

/* ---------- rendering ---------- */
/* ---------- server bot ---------- */
function setMode(next) {

async function serverCall(path, body) {
  const r = await fetch(serverUrl + path, {method: path === '/me' ? 'GET' : 'POST', cache: 'no-store',

// The server decides every close; the page replays the same engine on the latest candles so the view is

async function showServerBot(bot, id = serverLoadId) {

    return;

  const got = await Promise.allSettled(view.assets.map(a => fetchCandles(a, view.interval, 500, true)));
  if (id !== serverLoadId || mode !== 'server') return;
  got.forEach((g, i) => {

}
async function serverAction(button, label, path, body) {

  catch (e) { $('error').textContent = e.message; renderAll(); }

}

function renderCfg() {

function renderClock() {

    $('clock').innerHTML = `<span class="pulse"></span>Prochaine décision dans <b>${h ? h + ' h ' : ''}${two(m)}:${two(s)}</b> · 24 h/24`;
    return;
  }
  if (live.stopped) { $('clock').textContent = ''; return; }
  const step = STEP[live.interval], left = Math.ceil(Date.now() / step) * step - Date.now();

  if (code.replace(/[^A-Za-z0-9]/g, '').length < 12) { $('login-error').textContent = 'Le code fait 16 caractères, par exemple ABCD-EFGH-JKMN-PQRS.'; return; }
  serverCode = code; write(CODE_KEY, code); keepStorage(); $('login-error').textContent = ''; serverState = 'loading'; renderAll(); loadServer();
});
document.querySelector('.charts').addEventListener('scroll', e => {
  const el = e.currentTarget, i = Math.round(el.scrollLeft / Math.max(1, el.scrollWidth - el.clientWidth));
  $('chart-dots').querySelectorAll('i').forEach((d, k) => d.classList.toggle('on', k === i));
}, {passive: true});
$('logout').addEventListener('click', () => { if (!confirm('Te déconnecter ? Ton bot continue de tourner sur le serveur.')) return; serverCode = null; write(CODE_KEY, null); live = null; replay = null; serverState = 'login'; $('code').value = ''; renderAll(); });
$('stop').addEventListener('click', () => mode === 'server' ? serverAction('stop', 'Pause…', '/stop') : stopLive());
$('resume').addEventListener('click', () => serverAction('resume', 'Reprise…', '/resume'));
$('reset').addEventListener('click', () => { if (mode !== 'server') return resetLive(); if (confirm('Effacer ton bot serveur ? Son portefeuille fictif sera perdu.')) serverAction('reset', 'Effacement…', '/reset'); });
$('table-toggle').addEventListener('click', () => { const open = $('equity-table').hidden; $('equity-table').hidden = !open; $('table-toggle').setAttribute('aria-expanded', String(open)); $('table-toggle').textContent = open ? 'Masquer le tableau' : 'Voir les chiffres en tableau'; });
let rt; addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(renderAll, 200); });
// The bot always runs on the server (Cloudflare, 24 h/24). A bot left from the former on-device mode is put aside.
live = null;
setMode('server');
</script>
