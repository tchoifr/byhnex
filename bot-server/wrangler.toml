# Subscribers' bot server for byhnex.com, on Byhnex's own Cloudflare account (osvalt16's bot-worker/ is untouched).
# Deployed by .github/workflows/deploy-prod.yml when CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID are set;
# BOT_PUBLIC_KEY is passed at deploy time from the API server (the private key never leaves it).
name = "byhnex-bot-pro"
main = "worker.js"
compatibility_date = "2026-09-01"
workers_dev = true

[vars]
ALLOWED_ORIGINS = "https://byhnex.com"

[[durable_objects.bindings]]
name = "BOTS"
class_name = "PaidBotRoom"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["PaidBotRoom"]
