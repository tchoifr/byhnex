# Subscribers' bot server for byhnex.com, on Byhnex's own Cloudflare account (osvalt16's bot-worker/ is untouched).
# Deployed by .github/workflows/deploy-prod.yml when the CLOUDFLARE_API_TOKEN secret is set;
# BOT_PUBLIC_KEY is passed at deploy time from the API server (the private key never leaves it).
name = "byhnex-bot-pro"
main = "worker.js"
compatibility_date = "2026-09-01"
workers_dev = true
# Compte Cloudflare de Byhnex (propriétaire), distinct de celui d'osvalt16 : identifiant public, pas un secret.
account_id = "db69cdbe1f2b5a64b9ffa1ad4465f445"

[vars]
ALLOWED_ORIGINS = "https://byhnex.com"

[[durable_objects.bindings]]
name = "BOTS"
class_name = "PaidBotRoom"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["PaidBotRoom"]
